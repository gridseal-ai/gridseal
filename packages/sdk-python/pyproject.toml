[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridseal-sdk"
version = "0.1.0"
description = "Python SDK for GridSeal tamper-evident AI audit trails"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
authors = [
    { name = "Gridseal by Celestir" },
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
all = ["openai>=1.0.0", "anthropic>=0.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "openai>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.hatch.build.targets.wheel]
packages = ["gridseal"]

[tool.black]
target-version = ["py312"]
line-length = 100
