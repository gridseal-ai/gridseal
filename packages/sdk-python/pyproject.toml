[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridseal"
version = "0.5.1"
description = "Tamper-evident, cryptographically verifiable audit trail for AI decisions"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
authors = [
    { name = "Gridseal", email = "noreply@gridseal.ai" },
]
keywords = ["audit-trail", "hash-chain", "ai-governance", "tamper-evident", "compliance", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/gridseal-ai/gridseal"
Repository = "https://github.com/gridseal-ai/gridseal"
Issues = "https://github.com/gridseal-ai/gridseal/issues"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
all = ["openai>=1.0.0", "anthropic>=0.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.hatch.build.targets.wheel]
packages = ["gridseal"]

[tool.black]
target-version = ["py312"]
line-length = 100
